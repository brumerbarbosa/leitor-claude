<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0b18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Leitor Claude Code</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon-leitor-claude.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <header class="app-header">
      <div class="marca">
        <img class="marca-logo" src="assets/icons/icon-leitor-claude.svg" alt="" width="58" height="58">
        <div class="marca-texto">
          <span class="marca-kicker">LEITOR INTELIGENTE</span>
          <h1 class="titulo">Leitor Claude</h1>
          <p class="marca-assinatura">Ouça. Revise. Comente.</p>
        </div>
      </div>
      <span class="app-badge"><span class="app-badge-dot"></span> Sem login</span>
    </header>

    <section class="entrada-card" aria-labelledby="entrada-titulo">
      <div class="secao-cabecalho">
        <div>
          <span class="secao-kicker">NOVA LEITURA</span>
          <h2 id="entrada-titulo">Cole uma resposta</h2>
        </div>
        <span class="formato-badge">Markdown</span>
      </div>

    <label class="sr-only" for="input-texto">Mensagem para leitura</label>
    <textarea id="input-texto" placeholder="Cole aqui a mensagem do Claude Code..."></textarea>

    <div class="controles" aria-label="Controles de leitura">
      <button type="button" id="btn-carregar">▶ Carregar e Ouvir</button>
      <button type="button" id="btn-direto">ouvir sem filtro</button>
      <button type="button" id="btn-play" disabled>▶ Play</button>
      <button type="button" id="btn-pause" disabled>⏸</button>
      <button type="button" id="btn-stop" disabled>⏹</button>
      <div class="vel-wrap">
        <label for="velocidade">Vel:</label>
        <input type="range" id="velocidade" min="0.5" max="3" step="0.1" value="1.8">
        <span id="vel-display">1.8×</span>
      </div>
    </div>

    <div id="voz-info" aria-live="polite">Carregando vozes...</div>
    </section>

    <section id="bloco-removido" aria-label="Linhas removidas pelo filtro">
      <button type="button" id="toggle-removido">▸ ver linhas removidas</button>
      <div id="lista-removida"></div>
    </section>

    <div id="progresso-bar" role="progressbar" aria-label="Progresso da leitura" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progresso-fill"></div>
    </div>
    <article id="texto-renderizado"></article>
    <div id="status" aria-live="polite"></div>

    <section id="painel-comentarios">
      <h2 class="painel-titulo">
        💬 Comentários
        <span class="painel-acoes">
          <span id="copiado-ok">✓ copiado!</span>
          <button type="button" id="btn-copiar-comentarios">📋 Copiar tudo</button>
          <button type="button" id="btn-limpar-comentarios">limpar</button>
        </span>
      </h2>
      <div id="lista-comentarios"></div>
    </section>
  </main>

  <button type="button" id="btn-comentar-flutuante">💬 Comentar seleção</button>

  <div id="popup-comentario" role="dialog" aria-label="Adicionar comentário">
    <div id="popup-quote"></div>
    <label class="sr-only" for="popup-input">Comentário</label>
    <textarea id="popup-input" placeholder="Seu comentário..."></textarea>
    <div class="popup-btns">
      <button type="button" id="btn-mic" title="Falar para transcrever" aria-label="Falar para transcrever">🎙️</button>
      <button type="button" id="popup-cancelar">Cancelar</button>
      <button type="button" id="popup-salvar">Salvar</button>
    </div>
  </div>

  <aside id="notas-wrapper">
    <div id="notas-box">
      <div id="notas-header">
        <span>📝 Notas</span>
        <div id="notas-acoes">
          <button type="button" id="btn-minimizar" title="Minimizar" aria-label="Minimizar notas">─</button>
        </div>
      </div>
      <label class="sr-only" for="notas-textarea">Anotações</label>
      <textarea id="notas-textarea" placeholder="Digite suas anotações aqui..."></textarea>
      <div id="notas-rodape">
        <span id="notas-chars">0 caracteres</span>
        <button type="button" id="btn-limpar-notas">limpar</button>
      </div>
    </div>
  </aside>

  <!-- Scripts tradicionais com defer preservam a abertura direta via file://. -->
  <script defer src="js/app.js"></script>
  <script defer src="js/seguranca.js"></script>
  <script defer src="js/filtro.js"></script>
  <script defer src="js/renderizador.js"></script>
  <script defer src="js/leitor.js"></script>
  <script defer src="js/comentarios.js"></script>
  <script defer src="js/notas.js"></script>
</body>
</html>
